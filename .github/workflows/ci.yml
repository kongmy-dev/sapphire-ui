name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          # smoke-registry.ts is in the key so the packages only IT pulls
          # (shadcn CLI, consumer scaffold deps) get saved into the cache —
          # bun.lock alone wouldn't re-save when the smoke scaffold changes.
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', 'scripts/smoke-registry.ts') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run build  # tsc -b is the first step of build

      - name: Unit tests
        run: bun run test

      - name: Registry self-containment check
        run: bun run check:registry

      - name: Registry consumer test (vendor + typecheck + build)
        run: bun run test:registry

      - name: Registry smoke test (real shadcn add against local build)
        run: bun run smoke:registry

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Accessibility tests
        run: bun run test:a11y
