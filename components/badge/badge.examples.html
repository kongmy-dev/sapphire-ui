<header class="docs-page-header">
  <h1>Data Display</h1>
  <p>Components for presenting data: tables, tabs, badges, avatars, and separators.</p>
</header>

<section class="docs-section" data-pin="data/badge">
  <h2 class="docs-section-title">Badge</h2>
  <div class="docs-preview">
    <div class="docs-flex">
      <span class="sp-badge">default</span>
      <span class="sp-badge" data-variant="brand">accent</span>
      <span class="sp-badge" data-variant="success">success</span>
      <span class="sp-badge" data-variant="error">error</span>
      <span class="sp-badge" data-variant="warning">warning</span>
      <span class="sp-badge" data-variant="info">info</span>
    </div>
  </div>
  <div class="docs-preview docs-preview--stacked">
    <div class="docs-flex">
      <span class="sp-badge" data-size="sm">Small</span>
      <span class="sp-badge">Default</span>
      <span class="sp-badge" data-size="lg">Large</span>
    </div>
  </div>
  <div class="docs-preview docs-preview--dark docs-preview--stacked" data-theme="dark">
    <div class="docs-flex">
      <span class="sp-badge" data-variant="on-dark">On Dark</span>
      <span class="sp-badge" data-variant="brand">Accent</span>
    </div>
  </div>
</section>
