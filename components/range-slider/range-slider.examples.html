<section class="docs-section" data-pin="forms/range-slider" data-pin-y="1977.140625">

      <label class="sp-label">Volume: 50</label>

          </span>
        </span>
        <span class="sp-range-slider-value">50</span>
      </div>
    </div>
  </div>
</section>
