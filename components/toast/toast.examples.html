<header class="docs-page-header">
  <h1>Feedback</h1>
  <p>Loading states, progress indicators, alerts, and empty states.</p>
</header>

<section class="docs-section">
  <h2 class="docs-section-title">Toast</h2>
  <div class="docs-preview">
    <div class="sp-toast-viewport docs-toast-stage" role="status" aria-live="polite">
      <div class="sp-toast" data-state="open">
        <span class="sp-toast-icon" aria-hidden="true"></span>
        <span class="sp-toast-message">Changes saved successfully.</span>
      </div>
      <div class="sp-toast" data-variant="info" data-state="open">
        <span class="sp-toast-icon" aria-hidden="true"></span>
        <span class="sp-toast-message">Syncing data in the background.</span>
      </div>
      <div class="sp-toast" data-variant="warning" data-state="open">
        <span class="sp-toast-icon" aria-hidden="true"></span>
        <span class="sp-toast-message">API usage is approaching the limit.</span>
      </div>
      <div class="sp-toast" data-variant="error" data-state="open">
        <span class="sp-toast-icon" aria-hidden="true"></span>
        <span class="sp-toast-message">Failed to connect to the server.</span>
      </div>
    </div>
  </div>
</section>
