#:schema node_modules/wrangler/config-schema.json
name = "sapphire-ui-docs"
main = "worker/registry-404.ts"
compatibility_date = "2025-05-14"

[assets]
directory = "dist-docs"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Missing /r/* paths must be a real 404, not the SPA index.html — the shadcn
# CLI probes speculative registry URLs and dies on HTML.
run_worker_first = ["/r/*"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[routes]]
pattern = "design.kongmy.dev"
custom_domain = true
